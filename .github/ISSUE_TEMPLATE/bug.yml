name: Bug
description: Report something that is broken
labels: [bug]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
